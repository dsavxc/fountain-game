<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>yajuu-fountain</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      touch-action: manipulation;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="fountainCanvas"></canvas>

<script>
  const canvas = document.getElementById('fountainCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = [];
  let waterLevel = 0;
  const maxWaterLevel = 100;
  let totalScore = 0;
  let scorePopups = [];

  class Particle {
    constructor(x, y, isPowerUp, isMega = false) {
      this.x = x;
      this.y = y;
      
      const angle = isMega 
        ? (Math.PI * 1.0) + Math.random() * (Math.PI * 1.0)
        : (Math.PI * 1.3) + Math.random() * (Math.PI * 0.4); 
      
      const baseSpeed = isMega ? 20 : (isPowerUp ? 14 : 7);
      const speed = Math.random() * baseSpeed + (isPowerUp ? 4 : 2);
      
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      
      this.radius = Math.random() * (isMega ? 5 : 3) + 2;
      const hue = 185 + Math.random() * 30;
      this.color = `hsl(${hue}, 100%, 70%)`;
      
      this.life = 120 + Math.random() * 40;
      this.opacity = 1;
      this.gravity = 0.2;
    }

    update() {
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= 1;
      
      if (this.life < 40) {
        this.opacity = this.life / 40;
      }
    }

    draw() {
      if (this.opacity <= 0) return;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.opacity);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  function spawnFountain(x, y, isPowerUp = false, isMega = false) {
    const count = isMega ? 200 : (isPowerUp ? 60 : 15);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, isPowerUp, isMega));
    }

    if (!isMega) {
      waterLevel += isPowerUp ? 3.0 : 0.5;
      if (waterLevel >= maxWaterLevel) {
        triggerReset();
      }
    }
  }

  function triggerReset() {
    waterLevel = 0;
    spawnFountain(canvas.width / 2, canvas.height * 0.85, false, true);

    const randomBonus = Math.floor(Math.random() * 500) + 500;
    const gainedScore = 1000 + randomBonus;
    totalScore += gainedScore;

    scorePopups.push({
      text: `大噴射! +${gainedScore} PTS`,
      x: canvas.width / 2,
      y: canvas.height * 0.4,
      life: 80,
      opacity: 1.0
    });
  }

  setInterval(() => {
    spawnFountain(canvas.width / 2, canvas.height * 0.85, false);
  }, 150);

  function handleInput(e) {
    const startX = canvas.width / 2;
    const startY = canvas.height * 0.85;
    
    spawnFountain(startX, startY, true);
    totalScore += 10;
  }

  window.addEventListener('touchstart', (e) => {
    handleInput(e);
  });
  window.addEventListener('mousedown', handleInput);

  function animate() {
    // 画面クリア（クリア処理をシンプルにして暗転を防止）
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 水たまりの描画
    const waterHeight = (waterLevel / maxWaterLevel) * (canvas.height * 0.2);
    if (waterHeight > 0) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.fillRect(0, canvas.height - waterHeight, canvas.width, waterHeight);
    }

    // 噴水口
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height * 0.85, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();

    // 水滴の更新と描画
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].life <= 0 || particles[i].y > canvas.height) {
        particles.splice(i, 1);
      }
    }

    // UI（スコアとメーター）
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${totalScore}`, 20, 40);

    // ゲージ枠
    const barWidth = canvas.width - 40;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(20, 50, barWidth, 10);

    // ゲージ中身
    const fillWidth = (waterLevel / maxWaterLevel) * barWidth;
    ctx.fillStyle = waterLevel > 80 ? '#f43f5e' : '#38bdf8';
    ctx.fillRect(20, 50, fillWidth, 10);

    // スコア演出ポップアップ
    for (let i = scorePopups.length - 1; i >= 0; i--) {
      const popup = scorePopups[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, popup.opacity);
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(popup.text, popup.x, popup.y);
      ctx.restore();

      popup.y -= 1;
      popup.life -= 1;
      if (popup.life < 30) {
        popup.opacity = popup.life / 30;
      }
      if (popup.life <= 0) {
        scorePopups.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
