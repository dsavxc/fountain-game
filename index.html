<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>fountain-game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050a14; /* より深い夜空の色に */
      touch-action: manipulation;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="fountainCanvas"></canvas>

<script>
  const canvas = document.getElementById('fountainCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = [];

  class Particle {
    constructor(x, y, isPowerUp) {
      this.x = x;
      this.y = y;
      
      // --- パワーアップポイント1：噴出の物理挙動をリアルに ---
      // 角度を少し狭めて上に飛び散るように
      const angle = (Math.PI * 1.3) + Math.random() * (Math.PI * 0.4); 
      // 勢いをランダムにして、タップ時はさらに大噴射
      const baseSpeed = isPowerUp ? 15 : 8;
      const speed = Math.random() * baseSpeed + (isPowerUp ? 5 : 2);
      
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      
      // --- パワーアップポイント2：水滴の見た目を豪華に ---
      // 水滴の大きさをバラつかせる
      this.radius = Math.random() * 3 + 1;
      // 水色〜白のグラデーション（HSLで表現）
      const hue = 190 + Math.random() * 20; // 190-210 (水色)
      const saturation = 90 + Math.random() * 10;
      const lightness = 60 + Math.random() * 30; // 60-90 (白っぽく)
      this.color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
      
      // --- パワーアップポイント3：滞空時間を長く ---
      this.life = 150 + Math.random() * 50; // 寿命を長く
      this.opacity = 1;
      this.gravity = 0.15; // 重力を少し弱くして、ふんわり飛ばす
      this.friction = 0.99; // 空気抵抗を少し追加
    }

    update() {
      this.vx *= this.friction;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= 1;
      
      // 徐々に透明にする
      if (this.life < 50) {
        this.opacity = this.life / 50;
      }
    }

    draw() {
      if (this.opacity <= 0) return;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      
      // --- パワーアップポイント4：光る演出（グロー効果） ---
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
      
      // 描画後はエフェクトをリセット
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 0;
    }
  }

  // --- パワーアップポイント5：一度に出る水滴の数を大幅アップ ---
  function spawnFountain(x, y, isPowerUp = false) {
    const count = isPowerUp ? 100 : 30; // 通常30個、タップ時は100個！
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, isPowerUp));
    }
  }

  // 自動で少し噴水を出し続ける（ベースの噴水）
  setInterval(() => {
    spawnFountain(canvas.width / 2, canvas.height * 0.85, false);
  }, 100);

  // タップ/クリックイベント
  function handleInput(e) {
    // 画面中央下から大噴射
    const startX = canvas.width / 2;
    const startY = canvas.height * 0.85;
    
    spawnFountain(startX, startY, true); // trueで大噴射モード
  }

  window.addEventListener('touchstart', (e) => {
    e.preventDefault(); // スマホのズームなどを防止
    handleInput(e);
  }, { passive: false });
  window.addEventListener('mousedown', handleInput);

  function animate() {
    // 画面クリア（微かに残像を残す処理を調整）
    ctx.fillStyle = 'rgba(5, 10, 20, 0.2)'; // 残像を長めに
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 噴水口の描画
    const gradient = ctx.createRadialGradient(
      canvas.width / 2, canvas.height * 0.85, 0,
      canvas.width / 2, canvas.height * 0.85, 20
    );
    gradient.addColorStop(0, '#fff');
    gradient.addColorStop(0.5, '#38bdf8');
    gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height * 0.85, 20, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // パーティクルの更新と描画
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      
      // 画面外または寿命が尽きたら削除
      if (particles[i].life <= 0 || particles[i].y > canvas.height + 50) {
        particles.splice(i, 1);
      }
    }

    // パーティクル数の表示（デバッグ用、必要に応じてコメントアウト）
    // ctx.fillStyle = '#fff';
    // ctx.fillText(`Particles: ${particles.length}`, 10, 20);

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
