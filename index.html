<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>yajuu</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b132b;
      touch-action: manipulation;
      font-family: -apple-system, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="fountainCanvas"></canvas>

<script>
  const canvas = document.getElementById('fountainCanvas');
  const ctx = canvas.getContext('2d', { alpha: false }); // 描画モードを軽量化

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = [];
  let waterLevel = 0;
  const maxWaterLevel = 100;
  let totalScore = 0;
  let scorePopups = [];
  let waveOffset = 0;

  class Particle {
    constructor(x, y, isPowerUp, isMega = false) {
      this.x = x;
      this.y = y;
      
      const spread = isMega ? Math.PI * 1.0 : Math.PI * 0.3;
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * spread;
      
      const baseSpeed = isMega ? 20 : (isPowerUp ? 15 : 8);
      const speed = Math.random() * baseSpeed + (isPowerUp ? 3 : 2);
      
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      
      // 水滴の大きさ
      this.radius = Math.random() * 2.5 + 1.2;
      
      // 水色のグラデーション（発光処理の代わりに色で綺麗に見せる）
      const lightness = 65 + Math.random() * 25;
      this.color = `hsl(195, 90%, ${lightness}%)`;
      
      this.life = 100 + Math.random() * 30;
      this.maxLife = this.life;
      this.opacity = 1;
      this.gravity = 0.22;
    }

    update() {
      this.vx *= 0.98;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= 1;
      
      this.opacity = Math.max(0, this.life / this.maxLife);
    }

    draw() {
      if (this.opacity <= 0) return;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  function spawnFountain(x, y, isPowerUp = false, isMega = false) {
    // 粒の数を大幅に削減して軽量化
    const count = isMega ? 90 : (isPowerUp ? 30 : 5);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, isPowerUp, isMega));
    }

    if (!isMega) {
      waterLevel += isPowerUp ? 2.5 : 0.4;
      if (waterLevel >= maxWaterLevel) {
        triggerReset();
      }
    }
  }

  function triggerReset() {
    waterLevel = 0;
    spawnFountain(canvas.width / 2, canvas.height * 0.82, false, true);

    const randomBonus = Math.floor(Math.random() * 800) + 700;
    const gainedScore = 1000 + randomBonus;
    totalScore += gainedScore;

    scorePopups.push({
      text: `🌊 BIG BURST! +${gainedScore.toLocaleString()} 🌊`,
      x: canvas.width / 2,
      y: canvas.height * 0.35,
      life: 80,
      opacity: 1.0
    });
  }

  // 自動噴水（頻度を下げて軽く）
  setInterval(() => {
    spawnFountain(canvas.width / 2, canvas.height * 0.82, false);
  }, 120);

  function handleInput(e) {
    const startX = canvas.width / 2;
    const startY = canvas.height * 0.82;
    
    spawnFountain(startX, startY, true);
    totalScore += 15;
  }

  window.addEventListener('touchstart', (e) => {
    handleInput(e);
  }, { passive: true });
  window.addEventListener('mousedown', handleInput);

  function animate() {
    // 画面クリア（処理の軽い背景色描画）
    ctx.fillStyle = '#0b132b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    waveOffset += 0.05;

    // 波立つ水たまり（計算量を減らして軽量化）
    const waterBaseHeight = (waterLevel / maxWaterLevel) * (canvas.height * 0.2);
    if (waterBaseHeight > 0) {
      ctx.beginPath();
      const surfaceY = canvas.height - waterBaseHeight;
      ctx.moveTo(0, canvas.height);
      ctx.lineTo(0, surfaceY);
      
      // 描画の間隔（ステップ）を大きくして計算削減
      for (let x = 0; x <= canvas.width; x += 20) {
        const y = surfaceY + Math.sin(x * 0.02 + waveOffset) * 3;
        ctx.lineTo(x, y);
      }
      
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
      ctx.fill();
    }

    // 噴水口
    const fountainX = canvas.width / 2;
    const fountainY = canvas.height * 0.82;
    ctx.beginPath();
    ctx.arc(fountainX, fountainY, 12, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();

    // 水滴（パーティクル）の更新と描画
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].life <= 0 || particles[i].y > canvas.height) {
        particles.splice(i, 1);
      }
    }

    // スコアUI
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE  ${totalScore.toLocaleString()}`, 20, 40);

    // 水ゲージ
    const barWidth = canvas.width - 40;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(20, 50, barWidth, 6);

    const fillWidth = (waterLevel / maxWaterLevel) * barWidth;
    if (fillWidth > 0) {
      ctx.fillStyle = waterLevel > 80 ? '#f43f5e' : '#38bdf8';
      ctx.fillRect(20, 50, fillWidth, 6);
    }

    // スコアポップアップ
    for (let i = scorePopups.length - 1; i >= 0; i--) {
      const popup = scorePopups[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, popup.opacity);
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(popup.text, popup.x, popup.y);
      ctx.restore();

      popup.y -= 1;
      popup.life -= 1;
      if (popup.life < 25) {
        popup.opacity = popup.life / 25;
      }
      if (popup.life <= 0) {
        scorePopups.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
