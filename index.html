<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>fountain-yajuu</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 100%, #1e293b 0%, #020617 100%);
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="fountainCanvas"></canvas>

<script>
  const canvas = document.getElementById('fountainCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = [];
  let waterLevel = 0;
  const maxWaterLevel = 100;
  let totalScore = 0;
  let scorePopups = [];
  let waveOffset = 0; // 水面の波用

  class Particle {
    constructor(x, y, isPowerUp, isMega = false) {
      this.x = x;
      this.y = y;
      
      // 飛び散る角度と速度のリアリティ向上
      const spread = isMega ? Math.PI * 1.2 : Math.PI * 0.35;
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * spread;
      
      const baseSpeed = isMega ? 22 : (isPowerUp ? 16 : 9);
      const speed = Math.random() * baseSpeed + (isPowerUp ? 4 : 2);
      
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      
      // 水滴のサイズ：しぶき(小さい)〜大粒の水滴(大きい)
      this.radius = Math.random() < 0.2 ? Math.random() * 5 + 3 : Math.random() * 2.5 + 0.8;
      
      // 色：青〜リアルな白混じりのグラデーション表現
      const hue = 190 + Math.random() * 15;
      const lightness = 70 + Math.random() * 30; // 明るめで光って見える
      this.color = `hsl(${hue}, 95%, ${lightness}%)`;
      
      this.life = 130 + Math.random() * 50;
      this.maxLife = this.life;
      this.opacity = 1;
      this.gravity = 0.22;
      this.friction = 0.985; // 空気抵抗
    }

    update() {
      this.vx *= this.friction;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= 1;
      
      this.opacity = Math.max(0, this.life / this.maxLife);
    }

    draw() {
      if (this.opacity <= 0) return;
      ctx.save();
      
      // 輝き（発光エフェクト）
      ctx.shadowBlur = this.radius > 3 ? 12 : 4;
      ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
      
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
      
      ctx.restore();
    }
  }

  function spawnFountain(x, y, isPowerUp = false, isMega = false) {
    const count = isMega ? 220 : (isPowerUp ? 70 : 12);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, isPowerUp, isMega));
    }

    if (!isMega) {
      waterLevel += isPowerUp ? 2.5 : 0.4;
      if (waterLevel >= maxWaterLevel) {
        triggerReset();
      }
    }
  }

  function triggerReset() {
    waterLevel = 0;
    spawnFountain(canvas.width / 2, canvas.height * 0.82, false, true);

    const randomBonus = Math.floor(Math.random() * 800) + 700;
    const gainedScore = 1000 + randomBonus;
    totalScore += gainedScore;

    scorePopups.push({
      text: `🌊 BIG BURST! +${gainedScore.toLocaleString()} 🌊`,
      x: canvas.width / 2,
      y: canvas.height * 0.35,
      life: 90,
      opacity: 1.0
    });
  }

  // 常時少しだけ噴射（水の動きを演出）
  setInterval(() => {
    spawnFountain(canvas.width / 2, canvas.height * 0.82, false);
  }, 100);

  function handleInput(e) {
    const startX = canvas.width / 2;
    const startY = canvas.height * 0.82;
    
    spawnFountain(startX, startY, true);
    totalScore += 15;
  }

  window.addEventListener('touchstart', (e) => {
    handleInput(e);
  });
  window.addEventListener('mousedown', handleInput);

  function animate() {
    // リッチな背景描画（暗い残像感）
    ctx.fillStyle = 'rgba(2, 6, 23, 0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    waveOffset += 0.08;

    // --- 波立つ水たまり（リアルな水面）の描画 ---
    const waterBaseHeight = (waterLevel / maxWaterLevel) * (canvas.height * 0.22);
    if (waterBaseHeight > 0) {
      ctx.save();
      ctx.beginPath();
      const surfaceY = canvas.height - waterBaseHeight;
      
      ctx.moveTo(0, canvas.height);
      ctx.lineTo(0, surfaceY);
      
      // サイン波でゆらゆら動く水面を作成
      for (let x = 0; x <= canvas.width; x += 10) {
        const y = surfaceY + Math.sin(x * 0.03 + waveOffset) * 4;
        ctx.lineTo(x, y);
      }
      
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();

      // 水面のグラデーション
      const gradient = ctx.createLinearGradient(0, surfaceY, 0, canvas.height);
      gradient.addColorStop(0, 'rgba(56, 189, 248, 0.6)');
      gradient.addColorStop(0.3, 'rgba(14, 165, 233, 0.4)');
      gradient.addColorStop(1, 'rgba(3, 105, 161, 0.8)');
      
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.restore();
    }

    // --- 噴水口（ライトアップ演出） ---
    ctx.save();
    const fountainX = canvas.width / 2;
    const fountainY = canvas.height * 0.82;
    
    const glowGradient = ctx.createRadialGradient(
      fountainX, fountainY, 0,
      fountainX, fountainY, 35
    );
    glowGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    glowGradient.addColorStop(0.4, 'rgba(56, 189, 248, 0.8)');
    glowGradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
    
    ctx.beginPath();
    ctx.arc(fountainX, fountainY, 35, 0, Math.PI * 2);
    ctx.fillStyle = glowGradient;
    ctx.fill();
    ctx.restore();

    // --- 水滴（パーティクル）描画 ---
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].life <= 0 || particles[i].y > canvas.height) {
        particles.splice(i, 1);
      }
    }

    // --- UI（モダンなデザイン） ---
    // スコア
    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 22px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE  ${totalScore.toLocaleString()}`, 24, 45);

    // 水たまりゲージ（プログレスバー）
    const barWidth = canvas.width - 48;
    const barX = 24;
    const barY = 60;
    
    // ゲージ背景
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barWidth, 8, 4);
    ctx.fill();

    // ゲージ中身
    const fillWidth = (waterLevel / maxWaterLevel) * barWidth;
    if (fillWidth > 0) {
      ctx.fillStyle = waterLevel > 80 ? '#f43f5e' : '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(barX, barY, fillWidth, 8, 4);
      ctx.fill();
    }

    // スコアポップアップ演出
    for (let i = scorePopups.length - 1; i >= 0; i--) {
      const popup = scorePopups[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, popup.opacity);
      ctx.fillStyle = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#0284c7';
      ctx.font = 'bold 26px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(popup.text, popup.x, popup.y);
      ctx.restore();

      popup.y -= 1.2;
      popup.life -= 1;
      if (popup.life < 30) {
        popup.opacity = popup.life / 30;
      }
      if (popup.life <= 0) {
        scorePopups.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
