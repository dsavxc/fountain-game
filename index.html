<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>噴水タップゲーム</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      touch-action: manipulation;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="fountainCanvas"></canvas>

<script>
  const canvas = document.getElementById('fountainCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = [];

  class Particle {
    constructor(x, y, power) {
      this.x = x;
      this.y = y;
      // 噴出する方向と速度（上方向に飛び出す）
      const angle = (Math.PI * 1.2) + Math.random() * (Math.PI * 0.6);
      const speed = Math.random() * 8 + power;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      
      this.radius = Math.random() * 4 + 2;
      this.color = `hsl(${190 + Math.random() * 30}, 100%, 70%)`;
      this.life = 100;
      this.gravity = 0.25;
    }

    update() {
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= 1.5;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.life / 100);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  function spawnFountain(x, y, count = 15, power = 5) {
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, power));
    }
  }

  // タップ/クリックイベント
  function handleInput(e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    
    // タップ位置、または画面中央下から噴出
    const startX = canvas.width / 2;
    const startY = canvas.height * 0.8;
    
    spawnFountain(startX, startY, 30, 8);
  }

  window.addEventListener('touchstart', handleInput);
  window.addEventListener('mousedown', handleInput);

  function animate() {
    // 画面クリア（微かに残像を残す処理）
    ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 噴水口の描画
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height * 0.8, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();

    // パーティクルの更新と描画
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].life <= 0 || particles[i].y > canvas.height) {
        particles.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
